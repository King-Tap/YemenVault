name: Build APK Final 2026
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Fix Apt and Install Dependencies
        run: |
          # حل مشكلة exit code 100 بتنظيف الـ apt أولاً
          sudo rm -rf /var/lib/apt/lists/*
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev
          pip3 install --user buildozer cython==0.29.33 virtualenv

      - name: Build APK
        run: |
          export PATH=$PATH:$HOME/.local/bin
          # إنشاء الملف إذا فُقد بمواصفات تطبيقك
          if [ ! -f buildozer.spec ]; then
            cat <<EOT > buildozer.spec
          [app]
          title = Yemen Vault
          package.name = yemenivault
          package.domain = org.yemen
          source.dir = .
          source.include_exts = py,png,jpg,ttf
          version = 1.0.0
          requirements = python3,kivy,cryptography,arabic_reshaper,python-bidi
          orientation = portrait
          android.permissions = READ_EXTERNAL_STORAGE, WRITE_EXTERNAL_STORAGE
          android.api = 31
          android.archs = arm64-v8a
          EOT
          fi
          # تشغيل البناء مع الموافقة التلقائية على شروط أندرويد
          yes | python3 -m buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: yemen-vault-apk
          path: bin/*.apk
