name: Build APK Final 2026
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4 # تحديث للإصدار 4

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev
          pip3 install --user buildozer cython==0.29.33 virtualenv

      - name: Build APK
        run: |
          export PATH=$PATH:$HOME/.local/bin
          # إنشاء الملف إذا فُقد
          if [ ! -f buildozer.spec ]; then
            python3 -m buildozer init
          fi
          # تشغيل البناء
          python3 -m buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4 # تم التحديث إلى v4 لحل مشكلة الصورة
        with:
          name: my-final-apk
          path: bin/*.apk
