name: Build APK Force
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Buildozer and Dependencies
        run: |
          # تثبيت المكتبات الأساسية بدون تحديث النظام لتجنب خطأ 100
          pip install --user buildozer cython==0.29.33 virtualenv
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Build with Buildozer
        run: |
          # إنشاء ملف الإعدادات داخل السيرفر لضمان وجوده
          cat <<EOT > buildozer.spec
          [app]
          title = Yemen Vault
          package.name = yemenivault
          package.domain = org.yemen
          source.dir = .
          source.include_exts = py,png,jpg,ttf
          version = 1.0.0
          requirements = python3,kivy,cryptography,arabic_reshaper,python-bidi
          orientation = portrait
          android.permissions = READ_EXTERNAL_STORAGE, WRITE_EXTERNAL_STORAGE
          android.api = 31
          android.archs = arm64-v8a
          EOT

          # السر هنا: استخدام سطر يخبر buildozer أننا نعرف مخاطر الـ root ولكن استمر
          export PATH=$PATH:$HOME/.local/bin
          buildozer --version
          
          # إجبار البناء على الاستمرار حتى لو كان root
          yes | buildozer -v android debug
        
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: yemen-vault-apk
          path: bin/*.apk
